# 자동 점검: main에 올리거나 PR을 열 때마다 규칙·DB·화면을 확인한다.
# - 규칙: 신청서 입력 검사·관리자 목록·오류 알림 개인정보 제외 (vitest) + 타입 검사
# - DB: 로컬 Supabase에 마이그레이션을 모두 적용한 뒤 신청 → 입금 확인(정원) → 명단 파기·권한을 확인
# - 화면: 데이터베이스 없이(예시 데이터) 사이트·관리자 전 화면을 데스크톱·모바일로 열어 확인 (Playwright)
name: 자동 점검

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: 규칙 점검
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  database:
    name: DB 점검
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - name: 로컬 Supabase DB 시작 (마이그레이션 전부 적용)
        run: supabase db start
      - name: 신청·입금 확인·정원·명단 파기·권한
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/registration_flow.sql

  screens:
    name: 화면 점검
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-traces, path: web/test-results, retention-days: 7 }
